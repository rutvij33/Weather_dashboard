<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>🌤️ Weather Dashboard</h1>
      <div class="controls">
        <button id="unit-btn" title="Switch °C / °F">°C</button>
        <button id="theme-btn" title="Toggle theme">🌙</button>
      </div>
    </header>

    <div class="search">
      <input id="city-input" type="text" placeholder="Enter a city name..." autocomplete="off">
      <button id="search-btn" class="primary">Search</button>
      <button id="geo-btn" title="Use my location">📍</button>
    </div>

    <div id="recent" class="chips"></div>
    <div id="status" class="status hidden"></div>
    <section id="current" class="hidden"></section>
    <section id="forecast" class="grid"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
